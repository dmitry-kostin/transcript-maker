<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcript Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Background grid pattern -->
  <div class="bg-pattern">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-sm" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
        </pattern>
        <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
          <rect width="120" height="120" fill="url(#grid-sm)"/>
          <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid-lg)"/>
    </svg>
  </div>

  <main class="app" data-state="idle">

    <section class="hero">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none"><rect x="29" y="38" width="6" height="22" rx="3" fill="#f0a0b4" stroke="#c2185b" stroke-width="1.5"/><circle cx="32" cy="22" r="17" fill="#fce4ec" stroke="#c2185b" stroke-width="2.5"/><defs><clipPath id="lc"><circle cx="32" cy="22" r="15.5"/></clipPath></defs><g clip-path="url(#lc)"><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#e53935"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#64b5f6" transform="rotate(45,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#c6d84a" transform="rotate(90,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#fff" transform="rotate(135,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#e53935" transform="rotate(180,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#64b5f6" transform="rotate(225,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#c6d84a" transform="rotate(270,32,22)"/><path d="M32 22Q32 13 36 7A15.5 15.5 0 0 1 45.4 14.3Q38.6 15.4 32 22Z" fill="#fff" transform="rotate(315,32,22)"/></g><g stroke="#c2185b" stroke-width="2" fill="none" stroke-linecap="round"><path d="M32 22Q32 13 36 7"/><path d="M32 22Q32 13 36 7" transform="rotate(45,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(90,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(135,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(180,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(225,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(270,32,22)"/><path d="M32 22Q32 13 36 7" transform="rotate(315,32,22)"/></g></svg>
        <div class="logo-text">
          <h1 class="logo">Transcript Maker</h1>
          <p class="subtitle">Paste a YouTube URL, get a transcript and summarize with AI</p>
        </div>
      </div>

      <div class="command-bar">
        <svg class="command-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." autofocus>
        <kbd class="kbd-hint">Enter</kbd>
        <label class="diarize-pill">
          <input type="checkbox" id="diarize-toggle">
          <span class="pill-track"><span class="pill-thumb"></span></span>
          <span class="pill-label">Speakers</span>
        </label>
        <label class="duration-pill" title="Transcribe only the first N minutes of the video">
          <input type="checkbox" id="duration-toggle">
          <span class="pill-track"><span class="pill-thumb"></span></span>
          <span class="pill-label">First</span>
        </label>
        <div class="duration-input-group">
          <input type="number" id="duration-limit-input" min="1" max="480" value="5">
          <span class="duration-suffix">min</span>
        </div>
        <button id="transcribe-btn">
          <span>Transcribe</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <button id="cancel-btn" hidden>Cancel</button>
      </div>
    </section>

    <div id="progress" hidden>
      <div class="waveform-container">
        <div id="waveform" class="waveform stopped"></div>
        <div class="waveform-glow"></div>
      </div>
      <p id="progress-status" class="progress-status"></p>
    </div>

    <div id="active-result"></div>

    <div id="error" class="error-banner" hidden></div>

    <section id="history-section" class="history-section">
      <div class="history-header">
        <h2>History</h2>
        <button id="cleanup-btn" class="cleanup-btn">Clean up temp files</button>
      </div>
      <div id="history-list" class="history-grid">
        <p class="history-empty">No transcriptions yet.</p>
      </div>
    </section>

  </main>

  <div id="provider-selector" class="provider-selector" hidden>
    <button class="provider-btn" onclick="toggleProvider()">
      <span class="provider-dot"></span>
      <span class="provider-name"></span>
    </button>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"
          integrity="sha256-Nb0KZb2C6l8muFGMgRDLCOCAx7755BzjssCduBSt8F0="
          crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
</body>
</html>
