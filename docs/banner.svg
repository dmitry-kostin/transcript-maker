<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" fill="none">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a542"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="waveGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8a542"/>
      <stop offset="100%" stop-color="#b07a2a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="16" fill="#131318"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="100" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#titleGrad)">Transcript Maker</text>

  <!-- Subtitle -->
  <text x="450" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.56)">Paste a YouTube URL, Get a Transcript and Summarize with AI</text>

  <!-- Flowing waveform — smooth overlapping humps, centered, tapers to edges -->
  <g filter="url(#glow)">
    <!-- Thin baseline -->
    <line x1="60" y1="240" x2="840" y2="240" stroke="#c49a3a" stroke-width="0.5" opacity="0.25"/>

    <!-- Wave A: left hump, peak ~280 -->
    <path d="M100 240
      C140 240, 190 230, 240 210
      C265 198, 280 192, 300 198
      C330 210, 370 232, 420 240
      Z"
      fill="#c49a3a" opacity="0.25"/>
    <path d="M100 240
      C140 240, 190 248, 240 260
      C265 268, 280 272, 300 268
      C330 260, 370 248, 420 240
      Z"
      fill="#c49a3a" opacity="0.09"/>

    <!-- Wave B: center-left hump, peak ~420, tallest -->
    <path d="M220 240
      C270 240, 330 222, 380 198
      C400 186, 420 178, 440 178
      C460 178, 480 188, 510 205
      C550 225, 590 238, 640 240
      Z"
      fill="#d4943a" opacity="0.35"/>
    <path d="M220 240
      C270 240, 330 252, 380 268
      C400 276, 420 280, 440 280
      C460 280, 480 274, 510 262
      C550 248, 590 242, 640 240
      Z"
      fill="#d4943a" opacity="0.12"/>

    <!-- Wave C: right hump, peak ~660 -->
    <path d="M520 240
      C560 240, 600 230, 630 216
      C650 206, 660 200, 680 204
      C700 212, 730 230, 780 240
      Z"
      fill="#e8a542" opacity="0.3"/>
    <path d="M520 240
      C560 240, 600 248, 630 260
      C650 268, 660 272, 680 268
      C700 258, 730 246, 780 240
      Z"
      fill="#e8a542" opacity="0.1"/>

    <!-- Wave D: thin ripple hugging baseline, spans full width -->
    <path d="M60 240
      C100 236, 150 232, 200 235
      C250 238, 300 233, 350 236
      C400 239, 450 234, 500 237
      C550 240, 600 234, 650 236
      C700 238, 750 233, 800 236
      C830 238, 840 240, 840 240
      Z"
      fill="#e8a542" opacity="0.15"/>
    <path d="M60 240
      C100 244, 150 248, 200 245
      C250 242, 300 247, 350 244
      C400 241, 450 246, 500 243
      C550 240, 600 246, 650 244
      C700 242, 750 247, 800 244
      C830 242, 840 240, 840 240
      Z"
      fill="#e8a542" opacity="0.1"/>
  </g>
</svg>
