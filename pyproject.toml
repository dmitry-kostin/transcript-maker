[tool.poetry]
name = "transcript-maker"
version = "0.1.0"
description = "Paste a YouTube URL, get a transcript."
authors = ["dmitry-kostin"]
license = "MIT"
repository = "https://github.com/dmitry-kostin/transcript-maker"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.165"
uvicorn = {extras = ["standard"], version = "^0.54"}
yt-dlp = ">=2026.11.23"
openai = "^3.60"
pydantic-settings = "^2.16"
sse-starlette = "^3.7"
pyyaml = "^6.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2"
pytest-asyncio = "^1.5"
httpx = "^0.29"
json-repair = "^0.64"
ruff = "^0.17.6"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests using real YouTube download and OpenAI/Gemini APIs (deselected by default, run with -m integration)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, outdated syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
